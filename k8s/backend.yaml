apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend
spec:
  selector:
    app: fastapi-backend
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: fastapi
          image: genaiplatform2026.azurecr.io/genai-backend:v38
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: SECRET_KEY
              value: "your-secret-key-change-in-production"
            - name: VLLM_URL
              value: "http://vllm-service.ai:8000"
            - name: QDRANT_URL
              value: "http://qdrant-service.data:6333"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
      imagePullSecrets:
        - name: acr-secret
