name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'fastapi-backend.py'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

env:
  REGISTRY: genaiplatform2026.azurecr.io
  IMAGE_NAME: genai-backend
  MANIFEST: k8s/backend.yaml

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Short SHA tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Update manifest image tag
        run: |
          sed -i -E "s|image: .*genai-backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}|" ${{ env.MANIFEST }}
          if git diff --quiet; then
            echo "No manifest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST }}
          git commit -m "ci: update backend image to ${{ steps.vars.outputs.tag }}"
          git push
